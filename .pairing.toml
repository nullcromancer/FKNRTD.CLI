# Ghostrider pairing configuration.
#
# Verification is pinned rather than auto-discovered. `dotnet test` finds nothing here: the
# suite is a hand-rolled console harness, not a test framework, so an auto-discovered
# `dotnet test` would exit 0 having run nothing and report a green leg for an untested change.
# These are the two commands AGENTS.md names as the only evidence that counts.
#
# Keep each array on one line: the runtime's .pairing.toml reader is line-based and rejects a
# multi-line array.

[pairing]
profile = "standard"

# Two repair rounds is the standard-profile default and it has not been enough here, because
# rounds were spent on the environment rather than on the work: a sandbox that cannot commit, a
# worktree missing its prerequisite commit. Four leaves room for an actual second look.
max_rounds = 4
implementer = "codex"

# A linked Git worktree keeps its index under the MAIN repository's .git/worktrees/<name>/,
# not inside the worktree directory. Codex runs under workspace-write, which makes the worktree
# writable and nothing else, so every `git add` and `git commit` it attempted failed with
# "Unable to create ... index.lock: Permission denied" - three rounds in a row, each time after
# the work itself was finished and verified. The pairing runtime also stages through a temporary
# index under TEMP. Both directories are granted explicitly rather than widening the sandbox to
# danger-full-access, which would give away everything else with them.
codex_extra_args = ["--add-dir", "C:\DEV\GIT\FKNRTD.CLI\.git", "--add-dir", "C:\Users\ms\AppData\Local\Temp"]

[verification]
commands = ["dotnet build FKNRTD.CLI.sln -c Release", "dotnet run --project tests/FKNRTD.SelfTest/FKNRTD.SelfTest.csproj -c Release --no-build"]
